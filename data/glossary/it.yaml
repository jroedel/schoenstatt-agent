  # ---- the communities: secular institutes ----

  - en: Secular Institute
    it: Istituto Secolare
    why: laici.va `Istituti secolari`; the Padri page writes `Istituto Secolare dei Padri di Schoenstatt`.
    source: [sch-com-it-comunita, sch-com-it-padri, laici-va]

  - en: Sisters of Mary
    it: Sorelle di Maria
    context: the Schoenstatt Sisters of Mary, a secular institute
    why: >
      **`Sorelle`, not `Suore`.** Both circulate in Italian, and the institute's own
      usage settles it: its Rome house is registered as `Schoenstatt Istituto Secolare
      Sorelle di Maria` and its own channels are `Sorelle di Maria di Schoenstatt`.
      `Suore di Maria` appears in one schoenstatt.com article headline and is looser
      usage — they are consecrated laywomen in a secular institute, not religious
      sisters. es `Hermanas de María`, de `Marienschwestern`.
    source: [sch-com-it-comunita, sorelle-roma]
    phrase_ids: [6782, 5153, 7158, 7153]

  - en: Brothers of Mary
    it: Fratelli di Maria
    source: sch-com-it-comunita
    phrase_ids: [5149, 6153]

  - en: Ladies of Schoenstatt
    it: Signore di Schoenstatt
    context: a secular institute
    why: >
      The Italian index names it `Signore di Schoenstatt`, and that is what is written.

      **Correction (2026-08-10).** An earlier version of this entry said the Spanish row
      `Inst. Nuestra Señora de Schoenstatt` "appears to be an error". **It is not.** The
      institute's formal name is *Our Lady of Schoenstatt* — German
      `Institut Unserer Lieben Frau von Schönstatt`, and the Portuguese books published
      by the movement give `Instituto Secular Nossa Senhora de Schoenstatt` outright.
      *Ladies of Schoenstatt* is a second, colloquial English name for the same body, and
      the site holds both as separate keys (6781 and 5152). es, pt and de render both with
      the formal name; English is the odd one out.

      So `Signore di Schoenstatt` is the Italian movement's own colloquial form and is
      right for this key, while `Nostra Signora di Schoenstatt` is right for 5152 — which
      is how it is written. Two Italian names for one institute, matching the two English
      ones. This was caught while mining the Portuguese sources, not from Italian.
    source: [sch-com-it-comunita, pt-books]
    phrase_ids: [6781]

  - en: Family Institute
    it: Istituto di Famiglia
    why: >
      Singular, per the Italian index, where es pluralizes
      (`Instituto de Familias`).
    source: sch-com-it-comunita
    phrase_ids: [6147, 6742]

  - en: Diocesan Priests' Institute
    it: Istituto dei Sacerdoti Diocesani
    source: sch-com-it-comunita
    phrase_ids: [6143, 5150]

  - en: Schoenstatt Fathers
    it: Padri di Schoenstatt
    context: a secular institute of priests
    why: >
      The Italian index and the institute's own page agree, and the site already
      holds one Italian row using it — phrase 7148 reads
      `Padri di Schoenstatt, Florencio Varela`, written before this glossary existed.
      Full formal name `Istituto Secolare dei Padri di Schoenstatt`.
    source: [sch-com-it-comunita, sch-com-it-padri]
    phrase_ids: [6502, 5154, 5698, 7154, 7157]

  - en: Pilgrims' movement
    it: Movimento dei pellegrini
    why: laici.va, which names this tier explicitly. es `Movimiento de peregrinos`.
    source: laici-va
    phrase_ids: [5875, 5846]

  # ---- adjectives the site leans on heavily ----

  - en: Schoenstatt (as adjective — "Schoenstatt libraries", "Schoenstatt literature")
    it: schoenstattiano
    context: >
      es and pt both use the adjective `schoenstattiano` rather than a prepositional
      phrase — `Bibliotecas schoenstattianas`, `Literatura schoenstattiana`
    why: >
      Italian forms the same adjective, `schoenstattiano`, and the movement's Italian
      pages use `schoenstattiani` for members. Lowercase, agreeing in gender and
      number: `biblioteche schoenstattiane`, `letteratura schoenstattiana`.
      **This is the one entry here resting on es/pt shape rather than on an attested
      Italian phrase for each collocation** — the adjective is attested, the
      collocations are constructed. Flagged for review.
    source: sch-org-it
    review: true
    phrase_ids: [6768, 6505, 6514, 6765, 7314]

  - en: Kentenich (as adjective — "Kentenich dictionary")
    it: kentenichiano
    why: >
      es `Diccionario kentenichiano`, pt `Dicionário kentenichiano`. Italian forms it
      the same way. Lowercase.
    review: true
    phrase_ids: [6772, 6769]

  # ---- open: do not write these without asking ----

  - en: Schoenstatt wayside shrine
    it: Edicola di Schoenstatt
    context: >
      the `sch-wayside-shrine` association kind, defined at
      `module/Schoenstatt/config/module.config.php:403` with `name_format`
      `Schoenstatt wayside shrine %s`
    why: >
      **`Edicola`, on the movement's own Italian authority.** The Italian page on the
      network of shrines has a section headed `Le edicole di Schoenstatt` and glosses
      the term for readers who might not know it:
      `Le cappelle lungo la strada (edicole)`. That is the movement naming the thing
      itself, which beats reasoning from the other languages — and the other languages
      would not have got here: es `Ermita`, pt `Ermida` and de `Bildstock` are a
      hermitage, a hermitage and a wayside pillar, three different objects.
      `edicola` is the ordinary Italian word for a roadside or wall shrine and is
      what the movement uses.
      Plural `Edicole`. The bare `Wayside shrines` navigation label is `Edicole`,
      matching es `Hermitas`, which likewise drops the `de Schoenstatt`.
    source: sch-com-it-rete
    phrase_ids: [6527, 6718, 7230, 7229]

  - en: Google Knowledge Graph
    it: ~
    context: phrase 6191, and the Wikipedia URL beside it in 6190
    why: >
      No house convention. es translates it (`Gráfico de Conocimiento de Google`),
      pt keeps the English, de keeps the English with a gloss. The Italian Wikipedia
      article `Google Knowledge Graph` exists (pageid 4350212), so the URL in 6190
      could point at it. Awaiting a decision — asked, not yet answered.

  - en: Coenaculum-Heiligtum
    it: ~
    context: >
      a shrine name whose source key is German; the same shrine is
      `Cenáculo de Bellavista` in Spanish and `Santuario del Cenáculo` in the
      Spanish rendering of the German key
    why: >
      What a shrine is called in Italian is charism vocabulary, not translation. The
      site does not leave these alone in other languages, so leaving them alone in
      Italian is also a choice — but it is not one to make by guessing. There are
      164 phrases with a non-English source and they concentrate in exactly these
      shrine and publication names.

  # ---- added 2026-08-11, while closing the Italian gap ----
  #
  # These three were needed by the 54 rows written that day and were not here. They are
  # recorded as decisions with their evidence, and all three are on
  # ../../docs/it-review-2026-08-11.md — a derived charism name is not something to settle
  # from the siblings alone.

  - en: Covenant Mass
    it: Messa dell'Alleanza
    context: >
      the Mass celebrated on the 18th of the month; phrases 6980 and 6993, and inside the
      Villa Ballester notice 7285 as `Fiesta de Alianza`
    why: >
      Derived from the glossary's `Alleanza d'Amore`, on the German row of 6980, which reads
      `Bündnismesse` — so the site does translate this rather than keeping `Misa de Alianza`.
      es `Misa de Alianza`, pt `Missa de Aliança`. The **feast** rather than the Mass is
      `Festa dell'Alleanza`, which is what 7285 needed.
      **Constructed from the siblings, not attested in an Italian source.** If the movement's
      Italian says `Messa del Patto` or keeps `Alleanza d'Amore` in full, three rows change.
    review: true
    phrase_ids: [6980, 6993, 7285]

  - en: Schoenstatt Youth House
    it: Casa della Gioventù di Schoenstatt
    context: >
      the building in Budapest holding the altar of a closed shrine; phrases 9701 and 9702,
      whose source key is German
    why: >
      Renders de `Haus der Schönstatt-Jugend` and pt `Casa da Juventude de Schoenstatt`. The
      glossary has the two youth *branches* (`Gioventù Femminile`, `Gioventù Maschile`) but
      not the house. Whether an Italian reader recognises this as the name of a specific
      building in Budapest is a question for somebody who knows the Hungarian movement.
    review: true
    phrase_ids: [9701, 9702]

  - en: Daughter Shrine
    it: Santuario filiale
    context: a shrine affiliated to the Original Shrine; phrase 6971, the Ohio shrine
    why: >
      pt `Santuário filial` and de `Filialheiligtum` are both already on this row, written
      before this pass, so the term is translated rather than kept and the shape is settled.
      Lowercase adjective, as pt has it.
    phrase_ids: [6971]
