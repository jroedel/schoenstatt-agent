# Schoenstatt terms and their agreed Italian rendering.
#
# One entry per decision. `it` is what to write; `why` is the evidence that settled
# it, so the decision can be re-examined rather than merely obeyed. An entry with
# `it: ~` is an open question — do not guess it, ask.
#
# Verified against the capsule on 2026-08-10. See ../style/it.md for register.
#
# Two kinds of evidence appear here and they are not equal:
#
#   - **The movement's own Italian sources** — `schoenstatt.org/it`, `schoenstatt.com/it`
#     and the communities' own pages. These are authoritative for charism vocabulary:
#     they are what Italian Schoenstatt actually calls itself.
#   - **The site's other four languages.** These settle *house convention* — whether a
#     term is translated at all, and how it is shaped — but they cannot settle what the
#     Italian word is. Where an es/de rendering is the only evidence, the entry says so.
#
# Where the two disagree, the Italian source wins. Recorded so the next session does
# not re-derive it.

sources:
  - id: sch-org-it
    url: https://www.schoenstatt.org/it/servizi/conoscere-schoenstatt/il-santuario/
    what: >
      The international movement's Italian pages. Used for Santuario, Santuario
      Originale, Alleanza d'Amore, Capitale di Grazie, Madonna Pellegrina.
  - id: sch-com-it-comunita
    url: https://schoenstatt.com/it/nella-comunita/
    what: >
      The communities' own index, in Italian. This is the authority for the branch
      names — leagues, federations and secular institutes — and it names all
      eighteen of them explicitly.
  - id: sch-com-it-padri
    url: https://schoenstatt.com/it/nella-comunita/sacerdoti/padri-di-schoenstatt/
    what: Istituto Secolare dei Padri di Schoenstatt; Padre Joseph Kentenich.
  - id: laici-va
    url: http://www.laici.va/content/laici/it/sezioni/associazioni/repertorio/mov-ap-schoenstatt.html
    what: >
      The former Pontifical Council for the Laity's Italian entry. Authoritative for
      `Movimento Apostolico di Schoenstatt` and for the three-tier structure
      (Leghe apostoliche / Federazioni apostoliche / Istituti secolari). Archived and
      older than the movement's own pages — where it says `Patto d'amore` and the
      movement says `Alleanza d'Amore`, follow the movement.
  - id: sch-com-it-rete
    url: https://schoenstatt.com/it/informazioni-su-schoenstatt/santuario/la-rete-dei-santuari/
    what: >
      The network of shrines, in Italian. Settles `edicola` for the wayside shrines —
      it heads a section `Le edicole di Schoenstatt` and glosses it
      `Le cappelle lungo la strada (edicole)`. Also `Santuario Domestico` and
      `Santuario Originale`.
  - id: pt-books
    url: ~
    what: >
      The Portuguese Schoenstatt titles in `../reading-material`, published by
      the Instituto Secular Padres de Schoenstatt and the Irmãs de Maria — see
      `../glossary/pt.yaml` for the list. Cited here because they settle one Italian
      question the Italian sources did not: the formal name of the institute English calls
      *Ladies of Schoenstatt*.
  - id: sorelle-roma
    url: https://www.schoenstatt.org/it/tag/sorelle-di-maria-di-schoenstatt/
    what: >
      Settles Sorelle vs Suore. The institute's own Rome house is registered as
      `Schoenstatt Istituto Secolare Sorelle di Maria` (Via Aurelia Antica 112) and
      its own channels use `Sorelle di Maria di Schoenstatt`.

terms:

  # ---- the core vocabulary ----

  - en: Shrine
    it: Santuario
    context: the Schoenstatt Shrine, as a common noun and in headings
    why: >
      `Santuario` is the word the Italian movement uses for the shrine, and it
      capitalizes it when it means *the* Shrine — "il Santuario – il cuore di
      Schoenstatt". es `Santuario`, pt `Santuário`, de `Heiligtum` agree that the term
      is translated rather than kept.
    source: sch-org-it
    phrase_ids: [7002]

  - en: Shrines
    it: Santuari
    context: site navigation, the shrine listing
    why: >
      es `Santuarios`, pt `Santuários`, de `Heiligtümer` — every language translates
      it rather than keeping the English, and `santuario` is the ordinary Italian
      word the movement uses for the Schoenstatt Shrine.
    phrase_ids: [6535]

  - en: Schoenstatt Shrine
    it: Santuario di Schoenstatt
    context: the shrine kind, page titles, the `sch-shrine` association kind
    why: >
      The Italian movement writes `Santuario di Schoenstatt`. Note the preposition:
      Italian takes `di` where Spanish takes `de`. es `Santuario de Schoenstatt`,
      pt `Santuário de Schoenstatt`, de `Schönstatt-Heiligtum`.
      Two rows carry this string in different cases (6526 lowercase key, 7458 title
      case) and both are written `Santuario di Schoenstatt` — the site uses them in
      the same places and the German row for 7458 (`Heilegtum Schoenstatt`, a typo)
      shows the case distinction was never meaningful.
    source: sch-org-it
    phrase_ids: [6526, 7458, 6525]

  - en: Schoenstatt Shrines
    it: Santuari di Schoenstatt
    context: the collective, the shrine database's own subject
    why: es `Santuarios de Schoenstatt`, pt `Santuários de Schoenstatt`.
    source: sch-org-it
    phrase_ids: [6546]

  - en: Original Schoenstatt Shrine
    it: Santuario Originale
    context: the shrine at Vallendar, `Urheiligtum`
    why: >
      **`Santuario Originale`, not `Santuario Originario`.** The movement's Italian
      pages use `Santuario Originale` consistently, including on the Padri di
      Schoenstatt page. es `Santuario Original de Schoenstatt`, de `Urheiligtum`.
      `di Schoenstatt` is not repeated — the Italian sources call it simply the
      Santuario Originale, and there is only one.
    source: [sch-org-it, sch-com-it-padri]
    phrase_ids: [6818]

  - en: Covenant of Love
    it: Alleanza d'Amore
    context: the founding act of 18 October 1914
    why: >
      Capitalized as a proper name, and with the apostrophe. The movement's Italian
      pages are consistent. The archived Vatican entry says `Patto d'amore`; that is
      older usage and is **not** what the movement calls it — follow the movement.
    source: [sch-org-it, sch-com-it-padri, laici-va]

  - en: Capital of Grace
    it: Capitale di Grazie
    context: charism vocabulary — contributions to the shrine's store of grace
    why: The Italian movement's own term. Note `Grazie` plural.
    source: sch-org-it

  - en: Movement
    it: Movimento
    context: site navigation
    why: es `Movimiento`, de `Bewegung`.
    phrase_ids: [6356]

  - en: Schoenstatt Movement
    it: Movimento di Schoenstatt
    context: the movement as a whole
    why: >
      The movement's own Italian name. Its full formal name is
      `Movimento Apostolico di Schoenstatt`, which is what the Vatican entry uses;
      `Movimento di Schoenstatt` is the everyday form and the one the Italian pages
      lead with. es `Movimiento de Schoenstatt`.
    source: [sch-org-it, laici-va]
    phrase_ids: [6642]

  - en: Father Kentenich / Fr. Kentenich
    it: P. Giuseppe Kentenich
    context: the founder
    why: >
      The Italian pages use `P. Giuseppe Kentenich` and also `P. Josef Kentenich`;
      the given name is Italianized more often than not, and `P.` is the ordinary
      Italian abbreviation for *Padre*. Follow es, which writes `P. Kentenich` and
      `Padre José Kentenich` — the abbreviation in labels, the full form in prose.
      **Where the string is part of a proper name already in another language**
      (`Colegio Padre José Kentenich`, `Centro Padre José Kentenich`) leave it: that
      is the institution's name, not a description of the founder.
    source: sch-org-it

  - en: Mother Thrice Admirable
    it: Madre Tre Volte Ammirabile
    context: the title of Our Lady in Schoenstatt; `Mater Ter Admirabilis`
    why: >
      The movement's Italian pages write the full title as
      `Madre, Regina e Vittoriosa Tre Volte Ammirabile di Schoenstatt`. The Latin
      `Mater Ter Admirabilis` is also kept untranslated in Italian contexts, as it is
      in every language. Not yet needed by any phrase in the backlog; recorded because
      it will be.
    source: [sch-org-it, laici-va]

  - en: Pilgrim Mother
    it: Madonna Pellegrina
    context: the Pilgrim Mother campaign
    why: >
      The established Italian term. es `Virgen Peregrina`, pt `Mãe Peregrina`,
      de `Pilgernde Gottesmutter`. The campaign is
      `Campagna della Madonna Pellegrina`, matching es `Campaña Virgen Peregrina`.
    source: sch-org-it
    phrase_ids: [5847, 6136, 5876]

  - en: home shrine
    it: santuario domestico
    context: a shrine in a family's home
    why: >
      The Italian pages write `Santuari domestici` in the plural. Lowercase in
      running text; this is a kind of shrine, not the Shrine.
    source: sch-org-it

  - en: Schoenstatt Link
    it: Schoenstatt Link
    context: the site's own name
    why: >
      A proper name. es, pt and de all keep it verbatim. Written rather than left
      blank so it leaves the untranslated worklist. The string exists as a separate
      row in **seven** text domains (Application, Bible, Books, JTranslate, JUser,
      Schoenstatt, SionModel, ZfcUser) because the unique constraint is per domain —
      all of them need writing.
    phrase_ids: [5573, 6199, 5135, 5174, 5377, 5400, 5696, 5710, 6851]

